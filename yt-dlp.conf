# Base yt-dlp options for this project. Loaded by descargar.ps1 via --config-location.

# Default destination; descargar.ps1 overrides it with downloads/<categoria>
-P downloads

# File name: title (trimmed to 150 bytes) plus video id to avoid collisions
-o "%(title).150B [%(id)s].%(ext)s"

# Best video + best audio, merged into mp4
-f "bv*+ba/b"
--merge-output-format mp4

# Only the linked video, not the whole playlist it belongs to
--no-playlist

# Keep the original upload date as the file's modified time
--mtime
